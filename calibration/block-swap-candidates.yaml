# Named profile hypotheses used by the calibration search.  They are
# materialised as complete, run-scoped profiles before any GPU attempt starts;
# the harness never overrides blocks_to_swap on a CLI command line.  Every
# supported integer is present so "minimum stable" means the exact declared
# setting, not the nearest coarse bucket.
schema_version: 1
id: block-swap-grid-v2
profile_hypotheses:
