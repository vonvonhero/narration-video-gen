id: linux-wan22-480p-q4ks-ram16-vram8-simulated-bs40
schema_version: 1
platform: linux
recipe: wan22-s2v-480p-short-q4ks
status: experimental
qualification_state: short-oom
summary: Wan 2.2 480p Q4_K_S on a simulated 8 GiB GPU. Ran out of memory in the short test.

requires:
  gpu_vram_gib_min: 8
  host_ram_gib_min: 15
  swap_gib_min: 32
  free_disk_gib_min: 30

settings:
  vram_ballast_mib: 8192
  vram_ballast_device_index: 0
  blocks_to_swap: 40
  offload_transformer_before_vae_decode: true
  encode_tiled: false
  decode_tiled: false
  use_non_blocking: false

evidence:
  duration_class: short
  frames: 89
  seconds: 5.5625
  pipeline_stages: [s2v]
  gpu_evidence: capacity-simulated
  gpu_model: RTX 5060 Ti physical VRAM16 with 8192 MiB ballast
  visual_review: pending
  calibration_state: exhausted-at-maximum-block-swap
limitations:
  - Does not fit even at the maximum block swap (40).
