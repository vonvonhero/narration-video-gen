id: windows-wan21-720p-vram16
schema_version: 1
platform: windows-wsl2
recipe: wan21-infinitetalk-720p
status: acceptable
summary: Wan 2.1 720p on a 16 GiB GPU with 32 GiB RAM. Full length verified; not yet reviewed.

requires:
  gpu_vram_gib_min: 16
  physical_ram_gib_min: 32
  host_ram_gib_min: 20
  swap_gib_min: 48
  free_disk_gib_min: 55

settings:
  blocks_to_swap: 31
  offload_transformer_before_vae_decode: true
  face_detailer_size: 384
  face_detailer_blocks_to_swap: 30
  tiled_vae: false
  use_non_blocking: false
  wsl_ram_gib: 20
  wsl_swap_gib: 48
  rife_chunk_frames: 64

evidence:
  duration_class: full
  frames: 429
  seconds: 26.67
  pipeline_stages: [infinitetalk, face-detailer, rife, retime]
  gpu_evidence: physical
  gpu_model: NVIDIA GeForce RTX 5060 Ti (16 GiB)
  visual_review: pending
  references:
    - docs/evidence.md

limitations:
  - Swap use reached about 29 GiB.

host_changes:
  - >-
    WSL memory and swap are set in %UserProfile%\.wslconfig and only take effect
    after `wsl --shutdown`, which stops every WSL distribution on the machine.
