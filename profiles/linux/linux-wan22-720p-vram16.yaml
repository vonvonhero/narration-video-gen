id: linux-wan22-720p-vram16
schema_version: 1
platform: linux
recipe: wan22-s2v-720p
status: recommended
summary: Wan 2.2 720p on a 16 GiB GPU. Full length verified and reviewed.

requires:
  gpu_vram_gib_min: 16
  host_ram_gib_min: 19
  swap_gib_min: 20
  free_disk_gib_min: 80

settings:
  blocks_to_swap: 32
  face_detailer_size: 384
