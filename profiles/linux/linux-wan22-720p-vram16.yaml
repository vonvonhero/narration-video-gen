  encode_tiled: false
  decode_tiled: false
  offload_transformer_before_vae_decode: true
  use_non_blocking: false
  rife_chunk_frames: 64

evidence:
  duration_class: full
  frames: 457
  seconds: 28.59
  pipeline_stages: [s2v, face-detailer, rife, retime]
  gpu_evidence: physical
  gpu_model: NVIDIA RTX A4000 (16 GiB)
  visual_review: passed
  headroom_mib: 413
  stage_minutes:
    s2v: 87.8
    face-detailer: 9.0
    rife: 2.6
    retime: 0.1
  references:
    - docs/evidence.md

timing:
